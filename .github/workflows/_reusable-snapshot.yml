name: (reusable) Pull Alpaca account snapshot (no AI)

# Shared by every snapshot_*.yml workflow — see _reusable-trade.yml for why
# secret wiring stays explicit per caller instead of being centralized here.

on:
  workflow_call:
    inputs:
      agent_id:
        required: true
        type: string
    secrets:
      ALPACA_API_KEY:
        required: true
      ALPACA_SECRET_KEY:
        required: true
      SUPABASE_URL:
        required: true
      SUPABASE_KEY:
        required: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull account snapshot from Alpaca (${{ inputs.agent_id }})
        env:
          AGENT_ID: ${{ inputs.agent_id }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python snapshot.py
