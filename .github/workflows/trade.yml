name: Paper Trading Bot

on:
  # Triggered by a Supabase pg_cron job (see the trigger_github_workflow()
  # function + 'plutus-trigger' cron job in the life-dashboard Supabase
  # project), since GitHub's own native `schedule:` trigger never once
  # fired for this repo despite being correctly configured — a known,
  # occasionally-occurring GitHub-side flakiness. Deliberately not using
  # `schedule:` here anymore so there's no chance of double-firing if
  # GitHub's scheduler ever starts working. Intended decision cadence is
  # every 15 minutes during market hours (see instructions.md); regardless
  # of how often this trigger actually fires, main.py self-throttles real
  # decision runs to ~15 minutes apart via ai_agent.should_throttle_cadence().
  workflow_dispatch:
    inputs:
      source:
        description: "Internal: set to 'schedule' by the Supabase cron caller. Leave blank for a manual run."
        required: false

concurrency:
  group: trade-plutus
  # Cadence throttling (should_throttle_cadence) reads then writes Supabase,
  # which is racy if two runs for the same agent overlap (e.g. a manual dispatch
  # landing mid-cron-run) — both can read "last run was N minutes ago" and both
  # proceed, causing double orders. This serializes runs per agent instead:
  # cancel-in-progress: false means an in-flight run always finishes, and only
  # the single most recent queued trigger survives behind it.
  cancel-in-progress: false

jobs:
  trade:
    uses: ./.github/workflows/_reusable-trade.yml
    with:
      agent_id: plutus
      run_trigger: ${{ github.event.inputs.source || github.event_name }}
    secrets:
      # Plutus is the original agent — its secrets predate the
      # "_<agent_id>" suffix convention every later agent uses.
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
