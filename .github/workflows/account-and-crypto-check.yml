name: Account & Crypto Asset Check (read-only)

on:
  workflow_dispatch:
    inputs:
      agent_id:
        description: "Which agent's account to check"
        required: true
        default: "eris"
        type: choice
        options:
          - plutus
          - helios
          - hermes
          - eris

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check account and crypto assets
        env:
          AGENT_ID: ${{ inputs.agent_id }}
          ALPACA_API_KEY: ${{ inputs.agent_id == 'hermes' && secrets.ALPACA_API_KEY_HERMES || inputs.agent_id == 'helios' && secrets.ALPACA_API_KEY_HELIOS || inputs.agent_id == 'eris' && secrets.ALPACA_API_KEY_ERIS || secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ inputs.agent_id == 'hermes' && secrets.ALPACA_SECRET_KEY_HERMES || inputs.agent_id == 'helios' && secrets.ALPACA_SECRET_KEY_HELIOS || inputs.agent_id == 'eris' && secrets.ALPACA_SECRET_KEY_ERIS || secrets.ALPACA_SECRET_KEY }}
        run: PYTHONPATH=. python scripts/account_and_crypto_check.py
