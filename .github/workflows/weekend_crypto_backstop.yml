name: Weekend Crypto Stop-Loss Backstop (Eris)

# Crypto trades 24/7 on Alpaca, but every other trade/snapshot workflow only
# checks in during equity-market hours (see main.py's market_phase() gate),
# so a memecoin position could sit unguarded from Friday's last active_window
# run until Monday's pre-market review — see docs/profitability-analysis-
# 2026-07-09.md and ai_agent.run_weekend_crypto_backstop(). This workflow
# runs that sweep independently, every 3 hours across the weekend window.
# No AI call, no new positions opened — purely the per-position loss-cap
# disaster brake.

on:
  schedule:
    # Every 3 hours, all day Saturday and Sunday (UTC). Also covers Friday
    # evening / Monday pre-open since UTC dates span ET evenings/mornings.
    - cron: "0 */3 * * 6,0"
    # Friday 21:00-23:00 UTC (~5-7pm ET) and Monday 09:00-13:00 UTC
    # (~5-9am ET) catch the edges of the equity-hours gap in ET terms.
    - cron: "0 21 * * 5"
    - cron: "0 9,12 * * 1"
  workflow_dispatch: {}

concurrency:
  group: weekend-crypto-backstop-eris
  cancel-in-progress: false

jobs:
  backstop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekend crypto backstop (Eris)
        env:
          AGENT_ID: eris
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY_ERIS }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY_ERIS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: PYTHONPATH=. python scripts/weekend_crypto_backstop.py
