name: Weekly Agent Review

on:
  schedule:
    - cron: "0 18 * * 0" # Sundays, 18:00 UTC — after market close, before next week
  workflow_dispatch: {}

jobs:
  lessons-learned:
    strategy:
      matrix:
        agent: [plutus, helios, hermes, eris]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Update lessons learned for ${{ matrix.agent }}
        env:
          AGENT_ID: ${{ matrix.agent }}
          # Each agent runs on its own isolated Gemini project/quota (see
          # config.py and the per-agent trade_*.yml workflows) — this picks
          # the matching key so the weekly review never burns another
          # agent's quota or fails for lack of one.
          GEMINI_API_KEY: >-
            ${{
              matrix.agent == 'plutus' && secrets.GEMINI_API_KEY ||
              matrix.agent == 'helios' && secrets.GEMINI_API_KEY_HELIOS ||
              matrix.agent == 'hermes' && secrets.GEMINI_API_KEY_HERMES ||
              secrets.GEMINI_API_KEY_ERIS
            }}
          # Same per-agent split for Alpaca — needed so
          # _missed_opportunities can pull real price bars and current
          # positions for this agent's own account/universe.
          ALPACA_API_KEY: >-
            ${{
              matrix.agent == 'plutus' && secrets.ALPACA_API_KEY ||
              matrix.agent == 'helios' && secrets.ALPACA_API_KEY_HELIOS ||
              matrix.agent == 'hermes' && secrets.ALPACA_API_KEY_HERMES ||
              secrets.ALPACA_API_KEY_ERIS
            }}
          ALPACA_SECRET_KEY: >-
            ${{
              matrix.agent == 'plutus' && secrets.ALPACA_SECRET_KEY ||
              matrix.agent == 'helios' && secrets.ALPACA_SECRET_KEY_HELIOS ||
              matrix.agent == 'hermes' && secrets.ALPACA_SECRET_KEY_HERMES ||
              secrets.ALPACA_SECRET_KEY_ERIS
            }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: PYTHONPATH=. python scripts/lessons_learned.py

  weekly-digest:
    needs: lessons-learned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Send weekly digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: python scripts/weekly_digest.py
