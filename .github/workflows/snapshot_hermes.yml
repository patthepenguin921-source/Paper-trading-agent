name: Hermes Account Snapshot (no AI, Alpaca-only)

on:
  # Triggered every minute by a Supabase pg_cron job ('hermes-snapshot-trigger')
  # to keep dashboard data fresh independently of the 15-minute AI decision cycle.
  # Dispatched by the life-dashboard Supabase pg_cron jobs, which call
  # trigger_github_workflow() to POST to this repo's workflow_dispatch
  # API. As of the patthepenguin921-source migration the caller targets
  # workflows by filename (e.g. this file's name) rather than a numeric
  # workflow ID, so the wiring survives repo re-imports that renumber IDs.
  workflow_dispatch:
    inputs:
      source:
        description: "Internal: set to 'schedule' by the Supabase cron caller. Leave blank for a manual run."
        required: false

concurrency:
  group: snapshot-hermes
  # Cadence throttling (should_throttle_cadence) reads then writes Supabase,
  # which is racy if two runs for the same agent overlap (e.g. a manual dispatch
  # landing mid-cron-run) — both can read "last run was N minutes ago" and both
  # proceed, causing double orders. This serializes runs per agent instead:
  # cancel-in-progress: false means an in-flight run always finishes, and only
  # the single most recent queued trigger survives behind it.
  cancel-in-progress: false

jobs:
  snapshot:
    uses: ./.github/workflows/_reusable-snapshot.yml
    with:
      agent_id: hermes
    secrets:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY_HERMES }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY_HERMES }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
