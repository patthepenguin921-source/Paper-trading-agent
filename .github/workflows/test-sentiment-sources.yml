name: Test retail-sentiment data sources

# Probes the keyless retail-sentiment APIs the news pipeline can use, from a
# real GitHub Actions runner (what matters — Reddit's public API famously
# 403s these IPs while other services allow them). Dispatch manually
# whenever a sentiment source seems dead; no secrets needed.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sentiment endpoints
        run: |
          probe() {
            name="$1"; url="$2"
            code=$(curl -sS -m 15 -o /tmp/body -w "%{http_code}" \
              -H "User-Agent: trading-agent-probe/1.0 (paper trading research bot)" \
              "$url" || echo "ERR")
            echo "=== $name -> HTTP $code"
            head -c 300 /tmp/body; echo; echo
          }
          probe "Reddit public JSON (expected 403)" "https://www.reddit.com/r/wallstreetbets/hot.json?limit=3"
          probe "ApeWisdom stocks (Reddit mentions, aggregated)" "https://apewisdom.io/api/v1.0/filter/all-stocks/page/1"
          probe "ApeWisdom crypto" "https://apewisdom.io/api/v1.0/filter/all-crypto/page/1"
          probe "StockTwits symbol stream (AAPL)" "https://api.stocktwits.com/api/2/streams/symbol/AAPL.json"
          probe "StockTwits trending" "https://api.stocktwits.com/api/2/trending/symbols.json"
          probe "CoinGecko trending" "https://api.coingecko.com/api/v3/search/trending"
          probe "Crypto Fear & Greed (alternative.me)" "https://api.alternative.me/fng/?limit=1"
