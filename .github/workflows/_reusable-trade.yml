name: (reusable) Run trading bot

# Shared by every trade_*.yml workflow — checkout/install/run mechanics live
# here exactly once. Per-agent secret *wiring* (which repo secret maps to
# which env var — the naming varies: Plutus has no suffix, Hermes/Eris carry
# some historical quirks like a typo'd Groq secret name and a shared Groq
# key) deliberately stays explicit in each caller's `secrets:` block rather
# than being guessed at here, so this consolidation can't silently break
# which credentials an agent actually uses. What it does close: the class of
# bug from docs/profitability-analysis-2026-07-09.md where a setting (Gemini
# grounding) drifted between near-identical copies of this file and went
# unnoticed for 9 days — a fix to the run mechanics here now lands on every
# agent at once.

on:
  workflow_call:
    inputs:
      agent_id:
        required: true
        type: string
      run_trigger:
        required: true
        type: string
    secrets:
      ALPACA_API_KEY:
        required: true
      ALPACA_SECRET_KEY:
        required: true
      GEMINI_API_KEY:
        required: false
      GEMINI_API_KEY_2:
        required: false
      GROQ_API_KEY:
        required: false
      SUPABASE_URL:
        required: true
      SUPABASE_KEY:
        required: true
      NOTIFY_SECRET:
        required: false
      REDDIT_CLIENT_ID:
        required: false
      REDDIT_CLIENT_SECRET:
        required: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading bot (${{ inputs.agent_id }})
        env:
          AGENT_ID: ${{ inputs.agent_id }}
          RUN_TRIGGER: ${{ inputs.run_trigger }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python main.py
