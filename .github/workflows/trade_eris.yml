name: Eris Trading Bot (meme stocks / memecoins)

on:
  # Triggered by a Supabase pg_cron job ('eris-trigger') — see trade.yml
  # for why this no longer uses GitHub's native `schedule:` trigger.
  # Intended cadence is every 15 minutes during market hours, same as the
  # other three agents (see instructions_eris.md and schedule.py); regardless
  # of how often this external trigger actually fires, main.py itself
  # self-throttles real decision runs to ~15 minutes apart via
  # ai_agent.should_throttle_cadence(), so a faster or misconfigured
  # trigger can no longer burn through Gemini/Groq quota or cause
  # more-frequent-than-intended trading. Note: this is still the
  # equity-market-hours schedule — Eris' crypto leg trades 24/7 on Alpaca
  # but this workflow only checks in on it during the same windows as the
  # meme-stock leg (see instructions_eris.md's "Meme stocks vs. memecoins").
  workflow_dispatch:
    inputs:
      source:
        description: "Internal: set to 'schedule' by the Supabase cron caller. Leave blank for a manual run."
        required: false

concurrency:
  group: trade-eris
  # Cadence throttling (should_throttle_cadence) reads then writes Supabase,
  # which is racy if two runs for the same agent overlap (e.g. a manual dispatch
  # landing mid-cron-run) — both can read "last run was N minutes ago" and both
  # proceed, causing double orders. This serializes runs per agent instead:
  # cancel-in-progress: false means an in-flight run always finishes, and only
  # the single most recent queued trigger survives behind it.
  cancel-in-progress: false

jobs:
  trade:
    uses: ./.github/workflows/_reusable-trade.yml
    with:
      agent_id: eris
      run_trigger: ${{ github.event.inputs.source || github.event_name }}
    secrets:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY_ERIS }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY_ERIS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_ERIS }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_ERIS_2 }}
      # No dedicated Groq key for Eris — shares Hermes's GROK_API_KEY_2 as
      # the final Gemini-quota-exhausted fallback, same pairing as
      # Plutus/Helios sharing GROQ_API_KEY.
      GROQ_API_KEY: ${{ secrets.GROK_API_KEY_2 }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
